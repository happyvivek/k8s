---
# 1. ConfigMap with custom nginx.conf and another optional file
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}
    http {
      include       mime.types;
      default_type  application/octet-stream;

      server {
          listen 80;
          location / {
              return 200 "Hello from NGINX with ConfigMap!\n";
          }
      }
    }
  extra.conf: |
    # Extra file (optional)
    log_format main '$remote_addr - $remote_user [$time_local] "$request"';

---
# 2. Secret with dummy sensitive info
apiVersion: v1
kind: Secret
metadata:
  name: nginx-secret
type: Opaque
data:
  auth_user: YWRtaW4=           # base64 for 'admin'
  auth_pass: c2VjcmV0           # base64 for 'secret'

---
# 3. Pod with nginx using ConfigMap and Secret
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80

      volumeMounts:
        # Mount nginx.conf to the expected path using subPath
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf

        # Optionally mount the whole configmap to a folder
        - name: config-volume
          mountPath: /etc/nginx/conf.d

        # Mount secret values to a folder
        - name: secret-volume
          mountPath: /etc/nginx/secrets
          readOnly: true

  volumes:
    - name: config-volume
      configMap:
        name: nginx-config

    - name: secret-volume
      secret:
        secretName: nginx-secret

